version: "3.9"

services:
  odrprocesing:
    build:
      context: .
      dockerfile: services/processing/dockerfile
    container_name: ODRProcesing-env
    environment:
      HTTP_ADDR: ":5050"
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT}
      ALLOW_ORIGIN: ${ALLOW_ORIGIN}
      POSTGRES_HOST: ODRProcesing-postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_TIMEOUT: ${POSTGRES_TIMEOUT}
      LOGGER_LEVEL: ${LOGGER_LEVEL}
      TIME_ZONE: ${TIME_ZONE}
      LOGGER_FOLDER: ${LOGGER_FOLDER}
    ports:
      - "5050:5050"
    depends_on:
      - ODRProcesing-postgres
    restart: always

  reservation:
    build:
      context: .
      dockerfile: services/reservation/dockerfile
    container_name: ODRProcesing-reservation
    environment:
      HTTP_ADDR: ":8091"
      KAFKA_BROKER: kafka:9092
    ports:
      - "8091:8091"
    depends_on:
      - kafka
    restart: always

  ODRProcesing-postgres:
    image: postgres:16
    container_name: ODRProcesing-env-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: always

  ODRProcesing-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations

  zookeeper:
    image: confluentinc/cp-zookeeper:8.8.1
    container_name: ODRProcesing-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: always

  kafka:
    image: confluentinc/cp-kafka:8.8.1
    container_name: ODRProcesing-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_HOST://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    restart: always

  swagger:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.26.1-alpine
        RUN apk add --no-cache git
        RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6
        WORKDIR /code
        ENTRYPOINT ["swag"]
    volumes:
      - ./:/code


