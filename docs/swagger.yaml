basePath: /api/v1
definitions:
  github_com_AMmetro_ODRProcesing_internal_core_transport_http_response.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  github_com_AMmetro_ODRProcesing_internal_core_transport_http_types.Nullable-bool:
    properties:
      set:
        type: boolean
      value:
        type: boolean
    type: object
  github_com_AMmetro_ODRProcesing_internal_core_transport_http_types.Nullable-string:
    properties:
      set:
        type: boolean
      value:
        type: string
    type: object
  internal_features_statistics_transport_http.GetStatisticsResponse:
    properties:
      task_average_complition_time:
        description: '"1m30sec"'
        type: string
      task_completed:
        type: integer
      task_completed_rate:
        type: number
      task_created:
        type: integer
    type: object
  internal_features_tasks_transport_http.CreateTaskRequest:
    properties:
      author_user_id:
        type: integer
      completed:
        description: todo exclude
        type: boolean
      description:
        maxLength: 1000
        minLength: 1
        type: string
      title:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - author_user_id
    - title
    type: object
  internal_features_tasks_transport_http.TaskDTOResponse:
    properties:
      completed:
        type: boolean
      completed_at:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      title:
        type: string
      user_id:
        type: integer
      version:
        type: integer
    type: object
  internal_features_tasks_transport_http.UpdateTaskRequest:
    properties:
      completed:
        $ref: '#/definitions/github_com_AMmetro_ODRProcesing_internal_core_transport_http_types.Nullable-bool'
      description:
        $ref: '#/definitions/github_com_AMmetro_ODRProcesing_internal_core_transport_http_types.Nullable-string'
      title:
        $ref: '#/definitions/github_com_AMmetro_ODRProcesing_internal_core_transport_http_types.Nullable-string'
    type: object
  internal_features_userAgent_transport_http.CreateUserRequest:
    properties:
      full_name:
        example: John Doe
        maxLength: 100
        minLength: 3
        type: string
      phone_number:
        example: "+1234567890"
        maxLength: 15
        minLength: 10
        type: string
    required:
    - full_name
    type: object
  internal_features_userAgent_transport_http.UpdateUserRequest:
    properties:
      full_name:
        $ref: '#/definitions/github_com_AMmetro_ODRProcesing_internal_core_transport_http_types.Nullable-string'
      phone_number:
        $ref: '#/definitions/github_com_AMmetro_ODRProcesing_internal_core_transport_http_types.Nullable-string'
    type: object
  internal_features_userAgent_transport_http.UserDTOResponse:
    properties:
      full_name:
        type: string
      id:
        type: integer
      phone_number:
        type: string
      version:
        type: integer
    type: object
host: localhost:8090
info:
  contact: {}
  description: API for managing tasks, statistics, and user agents in ODR Processing
    system
  title: ODR Processing API
  version: "1.0"
paths:
  /statistics:
    get:
      consumes:
      - application/json
      description: Retrieve statistics for tasks within a date range and optionally
        filtered by user ID
      parameters:
      - description: User ID to filter statistics
        in: query
        name: userId
        type: integer
      - description: Start date in YYYY-MM-DD format
        in: query
        name: from
        type: string
      - description: End date in YYYY-MM-DD format
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_statistics_transport_http.GetStatisticsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AMmetro_ODRProcesing_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AMmetro_ODRProcesing_internal_core_transport_http_response.ErrorResponse'
      summary: Get Statistics
      tags:
      - statistics
  /task/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a task by ID
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AMmetro_ODRProcesing_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AMmetro_ODRProcesing_internal_core_transport_http_response.ErrorResponse'
      summary: Delete Task
      tags:
      - tasks
    get:
      consumes:
      - application/json
      description: Retrieve a single task by ID
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.TaskDTOResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_AMmetro_ODRProcesing_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AMmetro_ODRProcesing_internal_core_transport_http_response.ErrorResponse'
      summary: Get Task
      tags:
      - tasks
    patch:
      consumes:
      - application/json
      description: Update an existing task by ID
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      - description: Task update data
        in: body
        name: task
        required: true
        schema:
          $ref: '#/definitions/internal_features_tasks_transport_http.UpdateTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.TaskDTOResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_AMmetro_ODRProcesing_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AMmetro_ODRProcesing_internal_core_transport_http_response.ErrorResponse'
      summary: Update Task
      tags:
      - tasks
  /tasks:
    get:
      consumes:
      - application/json
      description: Retrieve a list of tasks with optional filtering by user ID, limit,
        and offset
      parameters:
      - description: Number of tasks to retrieve
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Number of tasks to skip
        in: query
        minimum: 0
        name: offset
        type: integer
      - description: Filter tasks by user ID
        in: query
        name: userId
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_features_tasks_transport_http.TaskDTOResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AMmetro_ODRProcesing_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AMmetro_ODRProcesing_internal_core_transport_http_response.ErrorResponse'
      summary: Get Tasks
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: Create a new task
      parameters:
      - description: Task data
        in: body
        name: task
        required: true
        schema:
          $ref: '#/definitions/internal_features_tasks_transport_http.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.TaskDTOResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AMmetro_ODRProcesing_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AMmetro_ODRProcesing_internal_core_transport_http_response.ErrorResponse'
      summary: Create Task
      tags:
      - tasks
  /user/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a user by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AMmetro_ODRProcesing_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_AMmetro_ODRProcesing_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AMmetro_ODRProcesing_internal_core_transport_http_response.ErrorResponse'
      summary: Delete User
      tags:
      - users
    get:
      consumes:
      - application/json
      description: Retrieve a single user by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_userAgent_transport_http.UserDTOResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_AMmetro_ODRProcesing_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AMmetro_ODRProcesing_internal_core_transport_http_response.ErrorResponse'
      summary: Get User
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: Update an existing user by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: User update data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/internal_features_userAgent_transport_http.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_userAgent_transport_http.UserDTOResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_AMmetro_ODRProcesing_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AMmetro_ODRProcesing_internal_core_transport_http_response.ErrorResponse'
      summary: Update User
      tags:
      - users
  /users:
    get:
      consumes:
      - application/json
      description: Retrieve a list of users with optional limit and offset
      parameters:
      - description: Number of users to retrieve
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Number of users to skip
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_features_userAgent_transport_http.UserDTOResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AMmetro_ODRProcesing_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AMmetro_ODRProcesing_internal_core_transport_http_response.ErrorResponse'
      summary: Get Users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Create a new user
      parameters:
      - description: User data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/internal_features_userAgent_transport_http.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_features_userAgent_transport_http.UserDTOResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AMmetro_ODRProcesing_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AMmetro_ODRProcesing_internal_core_transport_http_response.ErrorResponse'
      summary: Create User
      tags:
      - users
schemes:
- http
- https
